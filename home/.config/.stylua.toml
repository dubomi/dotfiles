
# Target Lua syntax version (Lua51, Lua52, Lua53, Lua54, Luau)
syntax = "All"

# Maximum width of a line before wrapping
column_width = 120

# Use spaces or tabs for indentation
indent_type = "Spaces"

# Number of spaces to use per indent (if indent_type is spaces)
indent_width = 2

# Quote style for strings ("AutoPreferDouble", "AutoPreferSingle", "ForceDouble", "ForceSingle")
quote_style = "AutoPreferDouble"

# Whether to put parentheses on function calls ("Always" or "None")
call_parentheses = "Always"
